---
- name: Include roles for Jellyfin Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Include roles for Jellyfin Molecule tests
      ansible.builtin.include_role:
        name: "{{ role_name }}"
        public: true
      loop:
        - com.devture.ansible.role.playbook_help
        - com.devture.ansible.role.systemd_docker_base
        - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      loop_control:
        loop_var: role_name

- name: Ensure Jellyfin service is started
  hosts: all
  become: true
  gather_facts: false
  tasks:
    # The role creates the media path; the marker goes in afterwards so that
    # Jellyfin can be asked to list it back out of the running container.
    - name: Ensure a marker file exists in the Jellyfin media path
      ansible.builtin.copy:
        content: "media path reached the process\n"
        dest: "/jellyfin/media/{{ jellyfin_molecule_marker_filename }}"
        mode: "0644"

    - name: Ensure systemd daemon is reloaded
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Ensure Jellyfin systemd service is started
      ansible.builtin.systemd_service:
        name: jellyfin.service
        state: started
