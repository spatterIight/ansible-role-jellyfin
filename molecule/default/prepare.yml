---
- name: Prepare Jellyfin Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated for Jellyfin Molecule tests preparation
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    - name: Ensure required packages are installed for Jellyfin Molecule tests preparation
      ansible.builtin.package:
        name:
          - python3-requests
          # The storage driver docker is pointed at below. Without the binary,
          # dockerd falls back to vfs without saying much about it.
          - fuse-overlayfs
        state: present

    - name: Ensure Docker is installed for Jellyfin Molecule tests preparation
      ansible.builtin.include_role:
        name: ansible-role-docker
      vars:
        docker_daemon_options:
          # `vfs` makes a full copy of every layer. The Jellyfin image is large
          # enough for that to dominate the run - `fuse-overlayfs` gives the same
          # nested-container isolation without the copying.
          storage-driver: fuse-overlayfs

    # The role bind-mounts this path but, unlike its own data and media paths,
    # does not create it. `--mount type=bind` refuses to start a container whose
    # source path is missing, so this doubles as a check that the role really
    # passes the additional volumes to `docker create`.
    - name: Ensure the Jellyfin Molecule additional volume source exists
      ansible.builtin.file:
        path: /jellyfin-molecule-extra
        state: directory
        mode: "0755"

    - name: Ensure a marker file exists in the Jellyfin Molecule additional volume
      ansible.builtin.copy:
        content: "additional volume reached the process\n"
        dest: "/jellyfin-molecule-extra/{{ jellyfin_molecule_marker_filename }}"
        mode: "0644"
